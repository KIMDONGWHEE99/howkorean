name: Deploy Website to GitHub Pages

on:
  # 한국어판: 이 저장소에는 GitHub Pages가 설정되어 있지 않으므로 푸시할 때
  # 자동으로 배포하지 않고 Actions 탭에서 수동으로만 실행합니다.
  # Pages를 설정한 뒤 자동 배포를 원하면 아래 주석을 해제하세요(원본 설정).
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - '**/*.md'
  #     - 'scripts/build_website.py'
  #     - 'scripts/vendor_assets.py'
  #     - 'scripts/website_templates/**'
  #     - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache vendor assets
        uses: actions/cache@v4
        with:
          path: scripts/.vendor-cache
          key: vendor-${{ hashFiles('scripts/vendor_assets.py') }}
          restore-keys: |
            vendor-

      - name: Build website
        run: uv run scripts/build_website.py --verbose

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
